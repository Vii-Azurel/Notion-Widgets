<!DOCTYPE html>
<html>
<head>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: transparent; 
            color: #333; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        .widget { 
            text-align: center; 
            background: rgba(255, 255, 255, 0.9); 
            padding: 20px; 
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            min-width: 200px;
        }
        .temp { font-size: 3.5em; font-weight: bold; margin: 0; line-height: 1; }
        .condition { font-size: 1.3em; color: #555; margin-top: 5px; font-weight: 500; }
        .wind { font-size: 0.95em; color: #777; margin-top: 10px; }
        .location { font-size: 0.8em; color: #999; margin-top: 15px; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="widget">
        <div class="temp" id="temp">--°C</div>
        <div class="condition" id="condition">Loading...</div>
        <div class="wind" id="wind">-- km/h</div>
        <div class="location">Live Forecast</div>
    </div>

    <script>
        // --- YOUR COORDINATES ---
        const lat = 27.559385089740317; 
        const lon = 41.72576674685148; 
        // ------------------------

        function getWeatherDescription(code) {
            const codes = {
                0: "Clear Sky ☀️",
                1: "Mainly Clear 🌤️", 2: "Partly Cloudy ⛅", 3: "Overcast ☁️",
                45: "Fog 🌫️", 48: "Rime Fog 🌫️",
                51: "Light Drizzle 🌦️", 53: "Drizzle 🌦️", 55: "Dense Drizzle 🌧️",
                61: "Slight Rain 🌧️", 63: "Rain 🌧️", 65: "Heavy Rain 🌧️",
                71: "Slight Snow 🌨️", 73: "Snow 🌨️", 75: "Heavy Snow ❄️",
                95: "Thunderstorm ⚡", 96: "Thunderstorm & Hail ⛈️", 99: "Severe Thunderstorm ⛈️"
            };
            return codes[code] || "Unknown";
        }

        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`)
            .then(res => {
                if (!res.ok) throw new Error("Network error");
                return res.json();
            })
            .then(data => {
                const w = data.current_weather;
                document.getElementById('temp').innerText = Math.round(w.temperature) + "°C";
                document.getElementById('condition').innerText = getWeatherDescription(w.weathercode);
                document.getElementById('wind').innerText = "Wind: " + w.windspeed + " km/h";
            })
            .catch(err => {
                console.error("Error:", err);
                document.getElementById('condition').innerText = "Data Unavailable";
            });
    </script>
</body>
</html>
